<h1>Flashcards</h1>

<h3>Current Flashcards: </h3>
<ul>
  @for (card of cardFront; track $index; let i = $index) {
    <li>{{ i }}. {{ card }}</li>
  }
</ul>

<h3>Create New Flashcards</h3>

<label>Enter the contents for the front and back of the flashcard: </label>
<br>
<input type="text" id="newcardFront" [(ngModel)]="newcardFront" placeholder="Enter Frontside Text">
<input type="text" id="newcardBack" [(ngModel)]="newcardBack" placeholder="Enter Backside Text">

<button (click)="addCard()">Create Card</button>

<h3>Display Flashcards</h3>
<form [formGroup]="displaycardForm">
  <div>
    <label for="card-index">Card Index: </label>
    <input
      id="card-index"
      type="number"
      placeholder="Enter the number of the desired card from your current list."
      formControlName="cardIndex">
  </div>
</form>
 <button (click)="displayCardfront()">
  Front
  </button>
<button (click)="displayCardback()">
  Back
  </button>
  <p> {{ selectedCard }}</p>
  <p> {{ errorMessage }}</p>
